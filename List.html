<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste des figurines - Skylanders Spyro's Adventure</title>
    <link href="style.css" rel="stylesheet">
    <style>
      .card {
        opacity: 0.4;
        transition: opacity 0.3s ease;
      }
      .card.owned {
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-light text-dark">
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">Skylanders Spyro's Adventure</a>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link active" href="List.html">Liste des figurines</a></li>
        </ul>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <div>
          <h1 class="h2">Liste des figurines</h1>
          <p class="mb-0">Total: <span id="totalCount">32</span> figurines, en votre possession: <span id="ownedCount">20</span>.</p>
        </div>
        <div class="d-flex gap-2 flex-column flex-sm-row">
          <div>
            <label for="filterElement" class="form-label mb-1">Filtrer par élément</label>
            <select id="filterElement" class="form-select">
              <option value="all">Tous les éléments</option>
              <option value="feu">Feu</option>
              <option value="eau">Eau</option>
              <option value="terre">Terre</option>
              <option value="air">Air</option>
              <option value="vie">Vie</option>
              <option value="magie">Magie</option>
              <option value="tech">Tech</option>
              <option value="mort">Mort-Vivant</option>
            </select>
          </div>
          <div class="d-flex flex-column gap-2">
            <div class="form-check mt-3 mt-sm-0">
              <input class="form-check-input" type="checkbox" id="selectedOnly">
              <label class="form-check-label" for="selectedOnly">Afficher seulement sélectionnés</label>
            </div>
            <button id="clearFilter" class="btn btn-secondary">Réinitialiser</button>
          </div>
        </div>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="figurineGrid"></div>
    </main>

    <footer class="py-4 bg-white border-top">
      <div class="container text-center">
        <p class="mb-0">© 2026 Skylanders Spyro's Adventure - Collection des figurines</p>
      </div>
    </footer>

    <script src="figurines.js"></script>
    <script>
      const storageKey = 'skylanders-owned';

      function createElementBadge(element) {
        const style = getElementStyle(element);
        return `<span class="badge" style="background-color: ${style.color}; color: ${style.text};">${style.label}</span>`;
      }

      function getSkyanderLink(name, element) {
        const filename = name.toLowerCase().replace(/\s+/g, '-');
        return `${element}/${filename}.html`;
      }

      function getOwnedFromStorage() {
        const saved = localStorage.getItem(storageKey);
        return saved ? JSON.parse(saved) : [];
      }

      function saveOwnedToStorage(ownedList) {
        localStorage.setItem(storageKey, JSON.stringify(ownedList));
      }

      function createCard(figure, ownedList) {
        const isOwned = ownedList.includes(figure.name);
        return `
          <div class="col">
            <div class="card h-100 shadow-sm border-0${isOwned ? ' owned' : ''}">
              <div class="card-body d-flex flex-column">
                <div class="mb-3">
                  <h2 class="h5 mb-1">${figure.name}</h2>
                  <div>${createElementBadge(figure.element)}</div>
                </div>
                <p class="mb-3 text-muted">${figure.description}</p>
                <div class="form-check mb-3">
                  <input class="form-check-input figurine-checkbox" type="checkbox" id="check-${encodeURIComponent(figure.name)}" data-name="${encodeURIComponent(figure.name)}" data-element="${figure.element}" ${isOwned ? 'checked' : ''}>
                  <label class="form-check-label" for="check-${encodeURIComponent(figure.name)}">Sélectionner pour voir le détail</label>
                </div>
                <button type="button" class="btn btn-outline-primary mt-auto detail-button" data-name="${encodeURIComponent(figure.name)}" data-element="${figure.element}" ${isOwned ? '' : 'disabled'}>Voir le détail</button>
              </div>
            </div>
          </div>
        `;
      }

      function initCardHandlers() {
        document.querySelectorAll('.figurine-checkbox').forEach((checkbox) => {
          checkbox.addEventListener('change', (event) => {
            const col = event.target.closest('.col');
            const card = col.querySelector('.card');
            const button = col.querySelector('.detail-button');
            const name = decodeURIComponent(event.target.getAttribute('data-name'));
            const ownedList = getOwnedFromStorage();

            if (event.target.checked) {
              card.classList.add('owned');
              button.disabled = false;
              if (!ownedList.includes(name)) {
                ownedList.push(name);
              }
            } else {
              card.classList.remove('owned');
              button.disabled = true;
              const index = ownedList.indexOf(name);
              if (index !== -1) {
                ownedList.splice(index, 1);
              }
            }

            saveOwnedToStorage(ownedList);
            updateOwnedCount();
          });
        });

        document.querySelectorAll('.detail-button').forEach((button) => {
          button.addEventListener('click', () => {
            if (!button.disabled) {
              const name = decodeURIComponent(button.getAttribute('data-name'));
              const element = button.getAttribute('data-element');
              const link = getSkyanderLink(name, element);
              window.location.href = link;
            }
          });
        });
      }

      function updateOwnedCount() {
        const ownedCount = getOwnedFromStorage().length;
        document.getElementById('ownedCount').textContent = ownedCount;
      }

      function renderFigures(filter = 'all') {
        const container = document.getElementById('figurineGrid');
        const ownedList = getOwnedFromStorage();
        const showSelectedOnly = document.getElementById('selectedOnly').checked;
        const filtered = figurines
          .filter(f => filter === 'all' || f.element.toLowerCase() === filter.toLowerCase())
          .filter(f => !showSelectedOnly || ownedList.includes(f.name));
        container.innerHTML = filtered.map((figure) => createCard(figure, ownedList)).join('');
        initCardHandlers();
      }

      document.getElementById('filterElement').addEventListener('change', (event) => {
        renderFigures(event.target.value);
      });

      document.getElementById('selectedOnly').addEventListener('change', () => {
        renderFigures(document.getElementById('filterElement').value);
      });

      document.getElementById('clearFilter').addEventListener('click', () => {
        document.getElementById('filterElement').value = 'all';
        document.getElementById('selectedOnly').checked = false;
        renderFigures('all');
      });

      document.getElementById('totalCount').textContent = figurines.length;
      updateOwnedCount();
      renderFigures();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-4ZStv7cQxvB0c+0k3i7Q8k9uZ2JjTgkGN+fX+RN1Y0+K4G4T7uq8UqR6WhLQfXg5" crossorigin="anonymous"></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail Skylander - Skylanders Spyro's Adventure</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body class="bg-light text-dark">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">Skylanders Spyro's Adventure</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="List.html">Liste des figurines</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div id="detailContent"></div>
    </main>

    <footer class="py-4 bg-white border-top">
      <div class="container text-center">
        <p class="mb-0">© 2026 Skylanders Spyro's Adventure - Détail Skylander</p>
      </div>
    </footer>

    <script src="figurines.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const skylanderName = params.get('name');
      const skylander = getSkylanderByName(skylanderName);
      const detailContent = document.getElementById('detailContent');

      if (!skylander) {
        detailContent.innerHTML = `
          <div class="alert alert-warning">Skylander introuvable. Retournez à la <a href="List.html">liste des figurines</a>.</div>
        `;
      } else {
        const style = getElementStyle(skylander.element);
        const improvements = skylander.improvements.split(', ').map(item => `<li>${item}</li>`).join('');

        detailContent.innerHTML = `
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
                <div>
                  <h1 class="display-6 mb-2">${skylander.name}</h1>
                  <span class="badge element-banner mb-2" style="background-color: ${style.color}; color: ${style.text};">${style.label}</span>
                  <p class="mb-1"><strong>Possession :</strong> ${skylander.owned ? 'Oui' : 'Non'}</p>
                  <p class="mb-0 text-muted">${skylander.description}</p>
                </div>
                <div class="text-end">
                  <a href="List.html" class="btn btn-outline-primary">Retour à la liste</a>
                </div>
              </div>

              <div class="row g-4">
                <div class="col-md-6">
                  <div class="border rounded-3 p-3 h-100" style="background: rgba(0,0,0,.03);">
                    <h2 class="h5">Statistiques</h2>
                    <p class="mb-0">${skylander.stats}</p>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="border rounded-3 p-3 h-100" style="background: rgba(0,0,0,.03);">
                    <h2 class="h5">Améliorations</h2>
                    <ul class="mb-0">${improvements}</ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-4ZStv7cQxvB0c+0k3i7Q8k9uZ2JjTgkGN+fX+RN1Y0+K4G4T7uq8UqR6WhLQfXg5" crossorigin="anonymous"></script>
  </body>
</html>
